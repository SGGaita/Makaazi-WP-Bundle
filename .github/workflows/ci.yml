name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: PHP syntax
        run: find plugins/makaazi-core plugins/makaazi-hero-slider themes/makaazi-theme tests/phpunit -name '*.php' -print0 | xargs -0 -n1 php -l | (! grep -v 'No syntax errors')
      - name: Composer
        if: matrix.php == '8.3'
        run: composer install --no-interaction --no-progress
      - name: Coding standards (WordPress, PHP 7.4+ compatibility)
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs -n
      - uses: actions/setup-node@v4
        if: matrix.php == '8.3'
        with:
          node-version: 20
      - name: JavaScript syntax
        if: matrix.php == '8.3'
        run: node tests/bin/check-js.mjs

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3' ]
        wp: [ '6.6', '7.0' ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: [ '3306:3306' ]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: WordPress test library
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}
      - name: Tests
        run: vendor/bin/phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  e2e:
    name: End-to-end (Playwright on wp-env)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Start WordPress
        run: npx wp-env start && npm run env:setup
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          WP_BASE_URL: http://localhost:8888
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: password
      - name: Debug log
        if: always()
        run: npx wp-env run cli cat wp-content/debug.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14
